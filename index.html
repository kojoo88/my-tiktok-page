<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kiss vlog (ဖားကန့်)</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background: linear-gradient(135deg, #0f0f23, #1a1a3e, #2d1b4e);
      background-size: 400% 400%;
      animation: bgGradient 15s ease infinite;
      min-height: 100vh;
      padding: 40px 20px;
      color: #fff;
      position: relative;
      overflow-x: hidden;
    }
    @keyframes bgGradient {
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }
    .particle{
      position:fixed; width:3px; height:3px;
      background:#ffd700; border-radius:50%;
      animation: fall linear infinite;
      pointer-events:none;
    }
    @keyframes fall{
      0%{transform:translateY(-10px);opacity:1;}
      100%{transform:translateY(100vh);opacity:0;}
    }
    .glow-follow{
      position:fixed; width:250px; height:250px;
      background:radial-gradient(circle, rgba(255,215,0,0.15), transparent 70%);
      border-radius:50%; pointer-events:none;
      transform:translate(-50%,-50%);
      transition:0.1s ease-out;
      z-index:0;
    }
    .container{max-width:420px;margin:0 auto;position:relative;z-index:1;}
    .avatar{
      width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0 auto 20px;
      display:block;border:3px solid #ffd700;
      box-shadow:0 0 30px rgba(255,215,0,0.35);
    }
    h1{
      font-size:28px;margin-bottom:8px;color:#ffd700;text-align:center;
      animation: glowText 2s ease-in-out infinite alternate;
    }
    @keyframes glowText {
      from{text-shadow:0 0 10px #ffd700;}
      to{text-shadow:0 0 25px #ffd700, 0 0 40px #ffa500;}
    }
    .bio{color:#ddd;margin-bottom:35px;line-height:1.8;text-align:center;}

    /* ====== 🔥 ပရီမီယံ TikTok ခလုတ် ====== */
    .tiktok-premium{
      display:block;
      background: linear-gradient(90deg, #00F2EA, #FF0050, #00F2EA);
      background-size: 300% 100%;
      color:#fff;
      text-decoration:none;
      padding:18px 24px;
      border-radius:16px;
      margin-bottom:20px;
      font-weight:bold;
      font-size:17px;
      text-align:center;
      animation: tiktokGradient 3s linear infinite;
      box-shadow: 0 0 20px rgba(0, 242, 234, 0.4), 0 0 40px rgba(255, 0, 80, 0.25);
      position:relative;
      overflow:hidden;
      transition:all 0.3s ease;
    }
    @keyframes tiktokGradient {
      0%{background-position:0% 50%;}
      100%{background-position:300% 50%;}
    }
    .tiktok-premium:hover{
      transform:scale(1.04) translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 242, 234, 0.6), 0 0 60px rgba(255, 0, 80, 0.4);
    }
    .tiktok-premium::before{
      content:"";
      position:absolute;
      top:0; left:-100%;
      width:100%; height:100%;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition:left 0.5s ease;
    }
    .tiktok-premium:hover::before{left:100%;}

    /* ====== သာမန်ခလုတ်များ ====== */
    .link{
      display:block;background:rgba(255,255,255,0.08);color:#fff;text-decoration:none;
      padding:16px;border-radius:14px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.15);
      transition:all 0.3s ease;
    }
    .link:hover{transform:translateY(-3px);border-color:#ffd700;background:rgba(255,215,0,0.1);}
  </style>
</head>
<body>
  <div class="glow-follow" id="glow"></div>
  <div class="container">
    <img src="ပုံလင့်ခ်ဒီမှာထည့်" class="avatar" alt="ပရိုဖိုင်">
    <h1>✨ kiss vlog (ဖားကန့်) ✨</h1>
    <p class="bio">ကိုယ်လမ်းကိုယ်လျှောက်နေတာ 🚶‍♂️<br>ဆိုးချင်းဆိုးမယ်၊ ကောင်းချင်းကောင်းမယ် ✨<br>သဘာဝရှုခင်း & ခရီးသွား 📍</p>

    <!-- 🔥 ပရီမီယံ TikTok ခလုတ် -->
    <a href="https://tiktok.com/@kissvloghk" class="tiktok-premium">
      🎬 TikTok ကိုယ့်စာမျက်နှာ
    </a>

    <a href="#" class="link">🛒 TikTok Shop Affiliate</a>
    <a href="gallery.html" class="link">📸 ဓာတ်ပုံပြခန်း</a>
    <a href="far-kham.html" class="link">📍 ဖားကန့်လမ်းညွှန်</a>
    <a href="#" class="link">💬 Telegram အဖွဲ့</a>
  </div>

<script>
const glow = document.getElementById('glow');
document.addEventListener('mousemove', e => {
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});
function createParticle(){
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random()*100 + 'vw';
  p.style.animationDuration = (Math.random()*5+5) + 's';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 12000);
}
setInterval(createParticle, 500);
</script>
</body>
</html>
